name: agent-gym
services:
  gym:
    build: .
    image: agent-gym:local
    init: true
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - gym-runs:/data
volumes:
  gym-runs:
